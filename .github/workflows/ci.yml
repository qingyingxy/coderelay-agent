name: CI

on:
  push:
    branches: [windows-agent]
  pull_request:
    branches: [windows-agent]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-check-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -s $(which fdfind) /usr/local/bin/fd

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Check
        run: npm run check

      - name: Test
        run: npm test

  windows-agent-smoke:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Initialize model catalog data
        run: npm run hydrate:model-data

      - name: Check
        run: npm run check

      - name: Run core Workflow regression
        working-directory: packages/coding-agent
        run: node ../../node_modules/vitest/dist/cli.js --run test/suite/workflow-direct.test.ts

      - name: Run offline Workflow showcase
        run: npm run demo:cli-agent-showcase

      - name: Run README configuration demo
        run: npx --no-install tsx packages/coding-agent/examples/sdk/25-config-workflow-demo.ts
